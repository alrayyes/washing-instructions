# Same commands CI runs, so the hook and the gate cannot drift.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: bunx --bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    # Prettier decides the layout and markdownlint then judges what Prettier
    # produced, so these two are piped rather than parallel. The other order has
    # markdownlint fixing something Prettier is about to overwrite.
    - name: markdown
      group:
        piped: true
        jobs:
          - name: prettier
            glob: "*.md"
            run: bunx --bun prettier --write {staged_files}
            stage_fixed: true
          - name: markdownlint
            glob: "*.md"
            run: bunx --bun markdownlint-cli2 {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: bunx --bun commitlint --edit {1}

# Nothing here writes. A hook that rewrote files under a push would leave the
# pushed commit and the working tree disagreeing about what was reviewed. Every
# linter runs in check mode over the whole tree rather than the staged set, so a
# file that reached a commit through --no-verify or arrived in a rebase is still
# caught before it is anyone else's problem.
pre-push:
  parallel: true
  jobs:
    - name: biome
      run: bun run lint
    - name: markdownlint
      run: bun run lint:md
    - name: typecheck
      run: bun run typecheck
    - name: test
      run: bun test
