config:
  # Prose wraps where it reads best; a hard column limit fights that.
  MD013: false
  # The README opens with a badge row, not a heading.
  MD041: false
  # Markdown's image syntax carries no width, and the screenshots are a tall
  # phone page next to a wide A4 one. <img> is the only way to show them side by
  # side at sensible sizes.
  #
  # <a> and <p> come with it, for the gallery of all six sheets: each picture
  # links to the PDF it was shot from, and the three sit in a row. A Markdown
  # table would do the layout, but Prettier pads its cells and LTeX reads that
  # padding as a repeated space — a table there fails the prose gate, and these
  # three tags do not.
  MD033:
    allowed_elements:
      - img
      - a
      - p

  # Below here: layout Prettier already decides. Prettier runs first and
  # markdownlint judges what it produced, so leaving these on would only give us
  # a hook that fails twice and fixes nothing.
  # List markers.
  MD004: false
  # List indentation.
  MD007: false
  # Consecutive blank lines.
  MD012: false
  # Emphasis characters.
  MD049: false
  MD050: false

globs:
  - "**/*.md"

ignores:
  # Not just node_modules/** — that only matches the root's, and each
  # workspace member (packages/core, packages/pdf) gets its own nested copy.
  - "**/node_modules/**"
  - "out/**"
  # Vendored by `vale sync`. Generated text belongs to nobody.
  - "styles/Google/**"
  - "styles/proselint/**"
  # Written by semantic-release from the commit subjects, and committed by the
  # release job without passing through any hook. Linting it means failing a
  # run over prose no human chose and no human can fix in place.
  - "CHANGELOG.md"
