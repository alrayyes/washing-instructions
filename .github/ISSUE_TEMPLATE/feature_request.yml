name: Feature request
description: Propose new functionality
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: User story shape.
      placeholder: "As a ‹who›, I want ‹what›, so that ‹why›."
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: 3-5 testable Given/When/Then rules.
      placeholder: |
        - Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
      description: Tests written and passing, diff reviewed, docs true again, QA'd against the criteria above.
    validations:
      required: true
