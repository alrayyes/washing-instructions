# Nobody picks a version by hand. The Conventional Commits that landed decide
# it — feat: takes the minor, fix: the patch, a BREAKING CHANGE: footer the
# major — and a merge of only docs: and chore: releases nothing at all.
#
# This is the one workflow that writes to main, and it writes nothing but the
# version and the changelog.
name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only when the checks that ran on that commit actually passed. A
    # workflow_run fires whatever the outcome, so without this a red main
    # would still cut a release.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Tag, commit the changelog, and create the GitHub release.
      contents: write
      # Comment on the issues and pull requests a release closes.
      issues: write
      pull-requests: write
    steps:
      # Fails here rather than three minutes later inside semantic-release,
      # where a missing token reads as an authentication error against GitHub
      # rather than as a secret nobody has created yet.
      - name: Check the release token exists
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set. See the release section of the README."
            exit 1
          fi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          # semantic-release reads every commit since the last tag to decide
          # what this one is, so a shallow clone would have it release the
          # wrong thing or nothing at all.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx --bun semantic-release
        env:
          # Not the job token. main requires status checks, and a ruleset
          # applies those to a direct push as well as to a pull request, so the
          # changelog commit from github-actions[bot] is rejected. A token
          # belonging to someone the ruleset lets bypass is what gets it in —
          # the same "repo-write token in a masked variable" this needed on the
          # old forge, wearing a different name.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
