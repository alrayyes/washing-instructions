# Runs the same commands as the git hooks in lefthook.yml, so the two cannot
# drift: the hook catches it early, this is the gate that cannot be skipped.
#
# Debian rather than Alpine, one image for every job. Both prose linters ship
# glibc binaries — Vale's is dynamically linked against glibc and libstdc++,
# LTeX bundles its own JRE — and neither will start on musl. On Alpine they
# install perfectly and then fail to execute, and the kernel reports a missing
# ELF interpreter as ENOENT against the path you asked to run, so the error
# names the binary rather than the reason. Not worth carrying three base images
# to save a few megabytes on the jobs that would not have minded.
image: oven/bun:1.3.14-debian@sha256:9dba1a1b43ce28c9d7931bfc4eb00feb63b0114720a0277a8f939ae4dfc9db6f

stages:
  - check
  - build

default:
  interruptible: true

# Not caching ~/.bun/install/cache on purpose: GitLab only archives paths under
# the build directory, so it caches nothing, and moving it there trades a fast
# cold install for a slow tar of the whole cache.
.install:
  before_script:
    - bun install --frozen-lockfile

# The image is bun's, so it carries no CA certificates. Anything fetching over
# HTTPS with its own HTTP client rather than bun's needs these first.
.certificates: &certificates
  - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates

check:
  stage: check
  extends: .install
  script:
    - bun run lint
    - bun run lint:md
    - bun run typecheck
    - bun test

# Prose gets its own two jobs rather than a line in the one above, so that when
# the pipeline goes red the job name says which tier failed: a grammar error is
# a mistake and a style alert is an opinion, and they are answered differently.

# Mechanics. LanguageTool's rule database — grammar, spelling, punctuation, the
# phonetic article — and mechanics have a right answer, so this one blocks.
# No bun install: it reads the Markdown directly and needs nothing from the
# lockfile.
ltex:
  stage: check
  variables:
    LTEX_VERSION: "18.7.0"
  before_script:
    - *certificates
    - apt-get install -y -qq --no-install-recommends curl
    - curl -sSfL -o ltex.tar.gz "https://github.com/ltex-plus/ltex-ls-plus/releases/download/${LTEX_VERSION}/ltex-ls-plus-${LTEX_VERSION}-linux-x64.tar.gz"
    - tar xzf ltex.tar.gz
  script:
    # It reports findings with exit code 3, not 1, so anything a job tests for
    # by number passes a failing document. Let the shell fail on non-zero.
    #
    # The files are named rather than passing `.`: LTeX traverses recursively
    # and reads plain text as prose, so a bare dot lints the committed Vale
    # vocabulary as if it were a document and fails on its own word list.
    - ./ltex-ls-plus-${LTEX_VERSION}/bin/ltex-cli-plus --client-configuration=.ltex.json README.md CLAUDE.md

# Style. House voice, weasel words, wordiness, undefined jargon. Advice rather
# than a verdict, so it reports at warning level and is allowed to fail: style
# that blocks a merge only teaches people to skip the hooks.
vale:
  stage: check
  before_script:
    # Without these, Vale cannot verify GitHub's certificate and downloads
    # nothing — and says so as "'Google' is not a valid URL or the directory
    # doesn't exist", which blames the package rather than the certificate.
    - *certificates
    - bun install --frozen-lockfile
  script:
    - bun run prose:sync
    - bun run lint:prose:advice
  allow_failure: true

pdfs:
  stage: build
  extends: .install
  script:
    - bun run generate
  artifacts:
    name: "washing-instructions-$CI_COMMIT_REF_SLUG"
    paths:
      - out/
    expire_in: 30 days
